services:
  - type: web
    name: bitewise-backend
    runtime: python
    plan: free
    buildCommand: pip install -r phase6_backend_api/requirements.txt
    startCommand: cd phase6_backend_api && gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false
      - key: DATA_ROOT
        value: /opt/render/project/src
    rootDir: .
